<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fútbol TV · Agenda de Partidos</title>
<meta name="theme-color" content="#07131f">
<style>
:root{
  --bg:#06111c; --panel:#0b1b2a; --panel2:#0e2234; --line:#1d3a52;
  --blue:#19a7ff; --blue2:#087bd0; --green:#16c784; --text:#f5f8fb;
  --muted:#91a6b9; --gold:#ffcc45;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(25,167,255,.13),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(22,199,132,.08),transparent 25%),
    linear-gradient(180deg,#06111c 0%,#071521 45%,#050e17 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;
  background-image:linear-gradient(90deg,#fff 1px,transparent 1px),linear-gradient(#fff 1px,transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 65%);
}
header{
  position:sticky;top:0;z-index:20;height:68px;padding:0 24px;
  display:flex;align-items:center;gap:14px;
  background:rgba(5,16,27,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid #1a344a;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:950;letter-spacing:.5px}
.ball{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,#19a7ff,#075eaa);
  box-shadow:0 6px 20px rgba(25,167,255,.25);font-size:21px
}
.brandText{font-size:19px}.brandText b{color:var(--blue)}
.headerRight{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;font-weight:800}
.tvPill{border:1px solid #27516d;background:#0b2234;padding:8px 11px;border-radius:999px;color:#dcecf8}
.tvDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#20d98c;margin-right:6px;box-shadow:0 0 9px #20d98c}

.hero{
  position:relative;overflow:hidden;padding:34px max(18px,5vw) 30px;
  border-bottom:1px solid #173249;
  background:
    linear-gradient(100deg,rgba(8,29,47,.97),rgba(8,29,47,.75)),
    radial-gradient(circle at 80% 50%,rgba(25,167,255,.2),transparent 35%);
}
.hero:after{
  content:"";position:absolute;right:-80px;top:-100px;width:330px;height:330px;border:2px solid rgba(255,255,255,.05);
  border-radius:50%;box-shadow:0 0 0 35px rgba(255,255,255,.018),0 0 0 70px rgba(255,255,255,.012)
}
.heroInner{max-width:1450px;margin:auto;position:relative;z-index:1}
.kicker{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--blue);margin-bottom:7px}
h1{margin:0;font-size:clamp(29px,4vw,48px);line-height:1;font-weight:950;letter-spacing:-1.5px}
.sub{margin-top:10px;color:#a9bac8;font-size:14px}
.heroStats{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.stat{padding:9px 13px;border:1px solid #24465e;background:rgba(7,23,37,.78);border-radius:10px;font-size:11px;font-weight:800;color:#d7e6f1}
.stat b{color:white;font-size:14px;margin-right:4px}

.wrap{max-width:1450px;margin:auto;padding:18px}
.sectionTop{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sectionTitle{font-size:18px;font-weight:950;margin:0}
.status{font-size:11px;color:var(--muted);font-weight:700}
.days{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:thin;scrollbar-color:#284a62 transparent
}
.day{
  min-width:118px;text-align:left;padding:12px 13px;color:#dce7ef;cursor:pointer;
  border:1px solid #223e54;background:linear-gradient(180deg,#0d2030,#0b1927);
  border-radius:13px;transition:.18s;box-shadow:0 3px 10px rgba(0,0,0,.12)
}
.day:hover{transform:translateY(-1px);border-color:#36739a}
.day.active{background:linear-gradient(135deg,#19a7ff,#087bd0);border-color:#19a7ff;box-shadow:0 8px 22px rgba(25,167,255,.18)}
.day b{display:block;font-size:12px}.day small{display:block;margin-top:4px;color:#9eb2c2;font-weight:700}
.day.active small{color:#eaf7ff}

.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 15px;scrollbar-width:thin}
.btn{
  white-space:nowrap;background:#0c1c2b;color:#cddce7;border:1px solid #203c53;
  border-radius:999px;padding:8px 12px;cursor:pointer;font-size:11px;font-weight:850;transition:.16s
}
.btn:hover{border-color:#39769b;color:#fff}
.btn.active{background:#159fe9;border-color:#159fe9;color:white;box-shadow:0 5px 15px rgba(21,159,233,.18)}

#content h2{margin:3px 0 12px;font-size:19px;text-transform:capitalize}
.match{
  position:relative;display:grid;grid-template-columns:74px 155px 1fr 330px;
  align-items:center;gap:15px;margin:9px 0;padding:13px 15px;
  background:linear-gradient(105deg,rgba(14,34,52,.97),rgba(10,25,39,.97));
  border:1px solid #1d3c54;border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,.14);overflow:hidden
}
.match:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#159fe9;opacity:.8}
.match:hover{border-color:#326887;transform:translateY(-1px);transition:.16s}
.time{font-size:23px;font-weight:950;letter-spacing:-.5px;text-align:center}
.comp{font-size:10px;color:#8fa9ba;text-transform:uppercase;letter-spacing:.55px;font-weight:900;line-height:1.3}
.teams{display:flex;align-items:center;justify-content:center;gap:18px;min-width:0}
.team{text-align:center;font-weight:850;min-width:125px;font-size:14px}
.crestBox{height:66px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.crest{width:61px;height:61px;object-fit:contain;display:block;background:transparent;border:0;box-shadow:none}
.fallback{
  width:61px;height:61px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:950;color:#dceaf4;background:#102b3e;border-radius:12px;border:1px solid #244d67
}
.score{
  width:39px;height:39px;display:grid;place-items:center;border-radius:50%;
  border:1px solid #2d526b;background:#071522;color:#91b3c9;font-size:11px;font-weight:950
}
.channels{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.ch{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#122b3e,#0b1c2a);
  border:1px solid #2b4e65;border-radius:8px;padding:7px 8px;
  font-size:10px;font-weight:900;color:#e1edf4
}
.ch:before{content:"TV";font-size:7px;color:#19a7ff;border:1px solid #27617f;border-radius:3px;padding:1px 2px}
.empty{padding:38px;text-align:center;color:#91a4b6;border:1px dashed #29465d;border-radius:15px;background:#0a1825}
.footer{
  max-width:1450px;margin:25px auto 0;padding:20px 18px 28px;color:#718a9d;
  font-size:10px;text-align:center;border-top:1px solid #172f43
}
.footer b{color:#a8bfce}.source{color:#159fe9;text-decoration:none}

@media(max-width:980px){
  .match{grid-template-columns:68px 1fr;gap:8px 13px}
  .comp{grid-column:2}.teams,.channels{grid-column:1/3}.teams{grid-row:2}.channels{justify-content:center}
}
@media(max-width:600px){
  header{padding:0 13px}.headerRight .tvPill{display:none}
  .hero{padding:28px 16px}.wrap{padding:13px}
  .match{padding:12px 10px;border-radius:13px}.time{font-size:20px}
  .teams{gap:8px}.team{min-width:95px;font-size:12px}.crestBox{height:58px}.crest,.fallback{width:53px;height:53px}
  .score{width:34px;height:34px}
  .channels{justify-content:center}.ch{font-size:9px;padding:6px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="ball">⚽</div>
    <div class="brandText">FÚTBOL<b> TV</b></div>
  </div>
  <div class="headerRight">
    <span class="tvPill"><span class="tvDot"></span>PROGRAMACIÓN TV</span>
    <span>ESPAÑA</span>
  </div>
</header>

<section class="hero">
  <div class="heroInner">
    <div class="kicker">⚽ AGENDA DE FÚTBOL · 📺 TELEVISIÓN</div>
    <h1>FÚTBOL EN TV</h1>
    <div class="sub">Todos los partidos, horarios y canales de televisión en España.</div>
    <div class="heroStats" id="heroStats"></div>
  </div>
</section>

<main class="wrap">
  <div class="sectionTop">
    <h2 class="sectionTitle">Partidos por día</h2>
    <div id="status" class="status">Cargando agenda…</div>
  </div>
  <div id="days" class="days"></div>
  <div class="filters" id="filters"></div>
  <div id="content"></div>
</main>

<footer class="footer">
  Programación de fútbol en televisión · Fuente de horarios y canales:
  <a class="source" href="https://www.futboltv.info/" target="_blank" rel="noopener">Fútbol TV</a>
  · <b>Actualización automática</b>
</footer>

<script>
let data=[], logos={}, selected=today(), filter='TODOS';
const daysEl=document.getElementById('days'), content=document.getElementById('content');
const status=document.getElementById('status'), heroStats=document.getElementById('heroStats');

function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
}
function add(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return esc((n||'⚽').split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase())}
function dayLabel(d){return d===today()?'HOY':new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short'}).toUpperCase()}

function drawDays(){
  daysEl.innerHTML=Array.from({length:7},(_,i)=>{
    const d=add(today(),i), count=data.filter(m=>m.date===d).length;
    return `<button class="day ${d===selected?'active':''}" onclick="selected='${d}';drawDays();render()">
      <b>${dayLabel(d)}</b>
      <small>${new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})} · ${count} partidos</small>
    </button>`
  }).join('')
}

const comps=[
 ['TODOS','🏆 Todos'],['Liga EA Sports','🇪🇸 LaLiga'],['Premier League','🏴 Premier'],
 ['Europa League','🌍 Europa'],['Serie A Italia','🇮🇹 Serie A'],['Bundesliga','🇩🇪 Bundesliga'],
 ['Ligue 1','🇫🇷 Ligue 1'],['Liga Hypermotion','🇪🇸 Segunda'],['Primera Federación','🇪🇸 1ª Federación'],['Liga F','♀️ Liga F']
];
document.getElementById('filters').innerHTML=comps.map((x,i)=>
 `<button class="btn ${i===0?'active':''}" onclick="setFilter('${x[0]}',this)">${x[1]}</button>`).join('');

function setFilter(x,b){
  filter=x;document.querySelectorAll('.btn').forEach(y=>y.classList.remove('active'));b.classList.add('active');render()
}

function logoFor(team,url){
  return url || logos[team] || logos[String(team).trim()] || ''
}
function badge(team,url){
  const name=esc(team||'');
  const ini=initials(team);
  const src=logoFor(team,url);
  if(src){
    return `<div class="crestBox"><img class="crest" src="${esc(src)}" alt="${name}" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="fallback" style="display:none">${ini}</span></div>`;
  }
  return `<div class="crestBox"><span class="fallback">${ini}</span></div>`;
}
function card(m){
  const channels=(m.channels||[]).map(c=>`<span class="ch">${esc(c)}</span>`).join('');
  return `<article class="match">
    <div class="time">${esc(m.time)}</div>
    <div class="comp">${esc(m.competition)}</div>
    <div class="teams">
      <div class="team">${badge(m.home,m.homeLogo)}${esc(m.home)}</div>
      <div class="score">VS</div>
      <div class="team">${badge(m.away,m.awayLogo)}${esc(m.away)}</div>
    </div>
    <div class="channels">${channels}</div>
  </article>`;
}
function render(){
  let x=data.filter(m=>m.date===selected&&(filter==='TODOS'||m.competition===filter));
  let title=selected===today()?'Hoy':new Date(selected+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  content.innerHTML=`<h2>${title}</h2>`+(x.length?x.map(card).join(''):'<div class="empty">No hay partidos para este día con este filtro.</div>');
}
function updateStats(){
  const todayCount=data.filter(m=>m.date===today()).length;
  const channelCount=new Set(data.flatMap(m=>m.channels||[])).size;
  heroStats.innerHTML=`<div class="stat"><b>${todayCount}</b> partidos hoy</div>
    <div class="stat"><b>${data.length}</b> en 7 días</div>
    <div class="stat"><b>${channelCount}</b> canales</div>`;
}
async function start(){
  try{
    const [mr,lr]=await Promise.all([
      fetch('matches.json?'+Date.now(),{cache:'no-store'}),
      fetch('logos.json?'+Date.now(),{cache:'no-store'})
    ]);
    if(!mr.ok)throw Error('matches');
    data=await mr.json();
    if(!Array.isArray(data))throw Error('data');
    if(lr.ok)logos=await lr.json();
    data=data.map(m=>({...m,homeLogo:logoFor(m.home,m.homeLogo),awayLogo:logoFor(m.away,m.awayLogo)}));
    drawDays();updateStats();render();
    status.textContent='Agenda cargada · '+data.length+' partidos';
  }catch(e){
    status.textContent='No se pudo cargar la agenda';
    content.innerHTML='<div class="empty">Error al cargar la agenda. Comprueba que matches.json y logos.json estén publicados.</div>';
  }
}
start();
</script>
</body>
</html>
