<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV Fútbol</title><style>
*{box-sizing:border-box}body{margin:0;background:#06101b;color:#f7f9fc;font-family:Arial,sans-serif}header{height:66px;background:#08121e;border-bottom:1px solid #26394e;display:flex;align-items:center;padding:0 22px;gap:20px}.logo{font-size:28px;font-weight:900}.logo span{color:#159bff}.right{margin-left:auto}.hero{padding:35px 5%;background:linear-gradient(90deg,#06101ded,#0b2940c0),url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1600&q=85") center/cover}.hero h1{font-size:42px;margin:0 0 7px}.hero p{color:#bdc9d5}main{max-width:1450px;margin:auto;padding:20px 24px}.days{display:flex;gap:9px;overflow:auto}.day{min-width:100px;padding:12px;border-radius:12px;background:#101d2b;border:1px solid #26394e;text-align:center;cursor:pointer}.day b{display:block}.day small{color:#91a1b3}.active{background:#159bff!important;border-color:#159bff!important}.toolbar{display:flex;gap:9px;overflow:auto;margin:14px 0}.filter{padding:11px 14px;white-space:nowrap;border-radius:10px;background:#101d2b;border:1px solid #26394e;color:#dce5ef}.match{display:grid;grid-template-columns:75px 125px 1fr 260px 45px;gap:13px;align-items:center;background:#101d2b;border:1px solid #20344a;border-radius:14px;padding:13px 15px;margin:8px 0}.time{font-size:22px;font-weight:900}.comp{font-size:11px;color:#a8b7c8;font-weight:800}.teams{display:flex;justify-content:center;align-items:center;gap:22px}.team{text-align:center;font-weight:700;min-width:105px}.crest{width:42px;height:42px;border-radius:50%;background:#25384b;display:grid;place-items:center;margin:auto auto 5px}.score{font-size:22px;font-weight:900}.channels{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}.channel{font-size:10px;font-weight:800;background:#07111c;border:1px solid #2a4055;border-radius:7px;padding:7px}.event{text-align:center;color:#aebccc;font-size:11px;grid-column:3}.live{color:#ff5965;font-weight:900}.finished{color:#8798aa;font-weight:900}.scheduled{color:#6aaef0;font-weight:900}.play{border:0;width:44px;height:44px;border-radius:50%;background:#263a50;color:white}.status{color:#9aabbc;font-size:13px;margin:10px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2bd673;margin-right:6px}@media(max-width:760px){.hero{padding:28px 17px}.hero h1{font-size:29px}main{padding:14px 10px}.match{grid-template-columns:58px 1fr 43px;gap:7px}.comp{grid-column:2}.teams{grid-column:1/3;font-size:13px}.channels{grid-column:1/3;justify-content:flex-start}.event{grid-column:1/3;text-align:left}.play{grid-column:3;grid-row:1/5}}
</style></head><body>
<header><div>☰</div><div class="logo">IPTV<span>▶</span></div><div class="right">⌕　⚙</div></header>
<section class="hero"><h1>PARTIDOS DE FÚTBOL</h1><p>🔴 En directo · ⏰ Próximos · 🏁 Finalizados</p></section>
<main><div id="days" class="days"></div><div class="toolbar"><div class="filter">🏆 España + Premier</div><div class="filter">📺 Canales</div><div class="filter">⭐ Favoritos</div><div class="filter" onclick="load()">↻ Actualizar</div></div><div class="status"><span class="dot"></span><span id="status">Cargando partidos…</span></div><div id="content"></div></main>
<script>
const API="https://worldcup26.ir/get/soccer";const leagues=[["esp.1","LALIGA EA SPORTS",["DAZN","DAZN LaLiga","Movistar LALIGA"]],["eng.1","PREMIER LEAGUE",["DAZN","DAZN 1"]]];let data=[],dates=[],selected="";
const fallback=[{date:"2026-09-14",time:"19:00",competition:"PREMIER LEAGUE",home:"Leeds United",away:"Newcastle United",status:"scheduled",score:null,events:[],channels:["DAZN"]},{date:"2026-09-14",time:"21:00",competition:"LALIGA EA SPORTS",home:"Villarreal CF",away:"Real Betis",status:"scheduled",score:null,events:[],channels:["Movistar LALIGA","DAZN"]},{date:"2026-09-13",time:"19:00",competition:"LALIGA EA SPORTS",home:"Real Sociedad",away:"Atlético de Madrid",status:"finished",score:{home:0,away:3},events:[],channels:["DAZN"]}];
function today(){let d=new Date();return d.toISOString().slice(0,10)}function localDate(s){return new Date(s).toLocaleDateString("sv-SE")}function localTime(s){return new Date(s).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}
function norm(j,league){return (j.events||j.data||j.matches||[]).map((e,i)=>{let c=e.competitions?.[0]||{},t=c.competitors||[],h=t.find(x=>x.homeAway==="home")||t[0]||{},a=t.find(x=>x.homeAway==="away")||t[1]||{},s=e.status?.type||{};let state=s.completed||s.state==="post"?"finished":s.state==="in"?"live":"scheduled";return{id:e.id||i,date:localDate(e.date||e.startTime||e.kickoffAt),time:localTime(e.date||e.startTime||e.kickoffAt),competition:league[1],home:h.team?.displayName||h.name||"Local",away:a.team?.displayName||a.name||"Visitante",status:state,minute:e.status?.displayClock||"",score:h.score!=null?{home:+h.score,away:+a.score}:null,events:[],channels:league[2]}})}
async function load(){document.getElementById("status").textContent="Actualizando…";let all=[];for(let l of leagues){try{let d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"),r=await fetch(`${API}/${l[0]}/scoreboard?dates=${ds}`);if(r.ok)all.push(...norm(await r.json(),l))}catch(e){}}data=all.length?all:fallback;document.getElementById("status").textContent=all.length?"Partidos reales actualizados · "+new Date().toLocaleTimeString("es-ES"):"Fuente no disponible · mostrando datos de respaldo";dates=[...new Set(data.map(x=>x.date))].sort();selected=dates.includes(today())?today():dates[0];draw();render(selected)}
function draw(){document.getElementById("days").innerHTML=dates.map((d,i)=>`<div class="day ${d===selected?"active":""}" onclick="selected='${d}';draw();render(selected)"><b>${d===today()?"HOY":new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short"}).toUpperCase()}</b><small>${new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"})}</small></div>`).join("")}
function card(m,i){let score=m.score?`<div class="score">${m.score.home} - ${m.score.away}</div>`:"VS";let st=m.status==="live"?`<span class="live">🔴 EN DIRECTO ${m.minute||""}</span>`:m.status==="finished"?`<span class="finished">🏁 FINALIZADO</span>`:`<span class="scheduled">⏰ PRÓXIMO</span>`;return `<article class="match"><div class="time">${m.time}</div><div class="comp">${m.competition}</div><div class="teams"><div class="team"><div class="crest">⚽</div>${m.home}</div><div>${score}</div><div class="team"><div class="crest">⚽</div>${m.away}</div></div><div class="channels">${m.channels.map(x=>`<span class="channel">${x}</span>`).join("")}</div><div class="event">${st}</div><button class="play">▶</button></article>`}
function render(d){let x=data.filter(m=>m.date===d),g=[["🔴 EN DIRECTO",x.filter(m=>m.status==="live")],["⏰ PRÓXIMAMENTE",x.filter(m=>m.status==="scheduled")],["🏁 FINALIZADOS",x.filter(m=>m.status==="finished")]],h=`<h2>${d===today()?"HOY":new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</h2>`;for(let z of g)if(z[1].length)h+=`<h2>${z[0]}</h2>`+z[1].map(card).join("");document.getElementById("content").innerHTML=h||"<p>No hay partidos.</p>"}
load();setInterval(load,60000);
</script></body></html>
