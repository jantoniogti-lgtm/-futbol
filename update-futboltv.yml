name: Actualizar partidos y canales
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Obtener calendario completo (7 días)
        run: python update_matches.py
      - name: Aplicar escudos
        run: python update_logos.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json logos.json
          git diff --cached --quiet || git commit -m "Actualizar partidos, canales y escudos"
          git push
